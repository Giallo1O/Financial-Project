services:
  # --- INFRASTRUTTURA ---
  postgres-transactions:
    image: postgres:16
    container_name: pg-trans
    environment:
      POSTGRES_DB: db_transactions
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pg_trans_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:16
    container_name: pg-users
    environment:
      POSTGRES_DB: db_users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-service:
    build: ./financial-manager-transaction
    container_name: transaction-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-trans:5432/db_transactions
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - USER_SERVICE_URL=http://user-service:8082
      # Lettura scontrini con Claude: imposta ANTHROPIC_API_KEY in .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      postgres-transactions:
        condition: service_healthy

  user-service:
    build: ./financial-manager-user
    container_name: user-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-users:5432/db_users
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      postgres-users:
        condition: service_healthy

  frontend-service:
    build:
      context: ./financial-manager-frontend
      args:
        # Percorsi relativi: il browser chiama lo stesso indirizzo da cui ha aperto l'app e nginx (nel container del
        # frontend) inoltra ai servizi. Cosi' funziona anche dal telefono, dove "localhost" sarebbe il telefono stesso.
        - VITE_TRANSACTION_API_URL=/api/transaction
        - VITE_USER_API_URL=/api/user
    container_name: frontend-react-app
    ports:
      - "3000:80"
    depends_on:
      - transaction-service
      - user-service

  # HTTPS dentro la rete privata Tailscale: https://finmanager.<nome-rete>.ts.net (vedi README, "HTTPS con Tailscale").
  # Parte solo se lo chiedi: docker compose --profile tailscale up -d
  # Non usa Funnel: l'app NON e' raggiungibile da internet, solo dai dispositivi della tua rete Tailscale.
  # BOZZA MAI AVVIATA: da rivedere/adattare (nome dispositivo, versione immagine, destinazione in tailscale/serve.json).
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    container_name: tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}          # serve solo al primo avvio (poi il login resta nel volume)
      - TS_HOSTNAME=finmanager              # diventa finmanager.<nome-rete>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json  # inoltra HTTPS (443) al frontend
      - TS_AUTH_ONCE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - frontend-service
    restart: unless-stopped

  # Backup giornaliero di entrambi i database in ./backups (compressi, ultimi 14 giorni).
  # Attenzione: sta sullo stesso disco del server; copia ogni tanto la cartella su un altro supporto.
  backup:
    image: postgres:16
    container_name: db-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres-transactions:
        condition: service_healthy
      postgres-users:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          d=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h pg-trans -U user db_transactions | gzip > /backups/transactions-$$d.sql.gz
          pg_dump -h pg-users -U user db_users | gzip > /backups/users-$$d.sql.gz
          find /backups -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  # BOZZA NON PROVATA (nell'ambiente di sviluppo non c'era Docker): copia dei backup FUORI dal server con restic.
  # Cifrata con RESTIC_PASSWORD e con storico (14 giorni, 8 settimane, 12 mesi). Parte con:
  #   docker compose --profile offsite up -d
  # Da fare prima: scegliere la destinazione e compilare RESTIC_* nel file .env (vedi .env.example e README).
  # Le variabili non sono "obbligatorie" qui sopra di proposito: in compose un `:?` romperebbe anche l'avvio normale.
  backup-offsite:
    image: restic/restic:0.17.3
    profiles: ["offsite"]
    container_name: db-backup-offsite
    hostname: finmanager # restic raggruppa le copie per nome macchina: non cambiarlo
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      # Solo per destinazioni S3 / Backblaze B2 (via S3): chiavi di accesso
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backups:/backups:ro
      - ./offsite:/root/.ssh:ro # solo per sftp: qui vanno la chiave privata (id_ed25519) e known_hosts
    depends_on:
      - backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$RESTIC_REPOSITORY" ] || [ -z "$$RESTIC_PASSWORD" ]; then
          echo "Imposta RESTIC_REPOSITORY e RESTIC_PASSWORD nel file .env"; exit 1
        fi
        restic cat config >/dev/null 2>&1 || restic init || exit 1
        sleep 300 # aspetta che il servizio backup abbia finito il dump del giorno
        while true; do
          restic backup /backups && restic forget --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
          sleep 86400
        done

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres-transactions
      - postgres-users

volumes:
  tailscale_state:
  pg_trans_data:
  pg_users_data:
