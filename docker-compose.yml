services:
  # --- INFRASTRUTTURA ---
  postgres-transactions:
    image: postgres:16
    container_name: pg-trans
    environment:
      POSTGRES_DB: db_transactions
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pg_trans_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:16
    container_name: pg-users
    environment:
      POSTGRES_DB: db_users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-service:
    build: ./financial-manager-transaction
    container_name: transaction-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-trans:5432/db_transactions
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - USER_SERVICE_URL=http://user-service:8082
    depends_on:
      postgres-transactions:
        condition: service_healthy

  user-service:
    build: ./financial-manager-user
    container_name: user-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-users:5432/db_users
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      postgres-users:
        condition: service_healthy

  frontend-service:
    build:
      context: ./financial-manager-frontend
      args:
        # Since the browser accesses the backend directly from the host machine,
        # we configure frontend to point to the exposed localhost ports.
        - VITE_TRANSACTION_API_URL=http://localhost:8080
        - VITE_USER_API_URL=http://localhost:8082
    container_name: frontend-react-app
    ports:
      - "3000:80"
    depends_on:
      - transaction-service
      - user-service

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres-transactions
      - postgres-users

volumes:
  pg_trans_data:
  pg_users_data:
