services:
  # --- INFRASTRUTTURA ---
  postgres-transactions:
    image: postgres:16
    container_name: pg-trans
    environment:
      POSTGRES_DB: db_transactions
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pg_trans_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:16
    container_name: pg-users
    environment:
      POSTGRES_DB: db_users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-service:
    build: ./financial-manager-transaction
    container_name: transaction-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-trans:5432/db_transactions
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - USER_SERVICE_URL=http://user-service:8082
      # Lettura scontrini con Claude: imposta ANTHROPIC_API_KEY in .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5-5}
      # Chiave per cifrare i segreti nel database (collegamento ad Home Assistant), vedi README
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
    depends_on:
      postgres-transactions:
        condition: service_healthy

  user-service:
    build: ./financial-manager-user
    container_name: user-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-users:5432/db_users
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      postgres-users:
        condition: service_healthy

  frontend-service:
    build:
      context: ./financial-manager-frontend
      args:
        # Percorsi relativi: il browser chiama lo stesso indirizzo da cui ha aperto l'app e nginx (nel container del
        # frontend) inoltra ai servizi. Cosi' funziona anche dal telefono, dove "localhost" sarebbe il telefono stesso.
        - VITE_TRANSACTION_API_URL=/api/transaction
        - VITE_USER_API_URL=/api/user
    container_name: frontend-react-app
    ports:
      - "3000:80"
    depends_on:
      - transaction-service
      - user-service

  # HTTPS dentro la rete privata Tailscale: https://finmanager.<nome-rete>.ts.net (vedi README, "HTTPS con Tailscale").
  # Parte solo se lo chiedi: docker compose --profile tailscale up -d
  # Non usa Funnel: l'app NON e' raggiungibile da internet, solo dai dispositivi della tua rete Tailscale.
  # BOZZA MAI AVVIATA: da rivedere/adattare (nome dispositivo, versione immagine, destinazione in tailscale/serve.json).
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    container_name: tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}          # serve solo al primo avvio (poi il login resta nel volume)
      - TS_HOSTNAME=finmanager              # diventa finmanager.<nome-rete>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json  # inoltra HTTPS (443) al frontend
      - TS_AUTH_ONCE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - frontend-service
    restart: unless-stopped

  # Backup giornaliero di entrambi i database in ./backups (compressi, ultimi 14 giorni).
  # Attenzione: sta sullo stesso disco del server; copia ogni tanto la cartella su un altro supporto.
  backup:
    image: postgres:16
    container_name: db-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres-transactions:
        condition: service_healthy
      postgres-users:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          d=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h pg-trans -U user db_transactions | gzip > /backups/transactions-$$d.sql.gz
          pg_dump -h pg-users -U user db_users | gzip > /backups/users-$$d.sql.gz
          find /backups -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres-transactions
      - postgres-users

volumes:
  tailscale_state:
  pg_trans_data:
  pg_users_data:
