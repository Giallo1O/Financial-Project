apiVersion: v1
kind: Namespace
metadata:
  name: finmanager
---
# ==========================================
# DATABASES & STORAGE
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-trans-pvc
  namespace: finmanager
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-trans
  namespace: finmanager
spec:
  selector:
    matchLabels:
      app: pg-trans
  template:
    metadata:
      labels:
        app: pg-trans
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: db_transactions
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finmanager-db
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-trans-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pg-trans
  namespace: finmanager
spec:
  ports:
    - port: 5432
  selector:
    app: pg-trans
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-users-pvc
  namespace: finmanager
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-users
  namespace: finmanager
spec:
  selector:
    matchLabels:
      app: pg-users
  template:
    metadata:
      labels:
        app: pg-users
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: db_users
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finmanager-db
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-users-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pg-users
  namespace: finmanager
spec:
  ports:
    - port: 5432
  selector:
    app: pg-users
---
# ==========================================
# MICROSERVICES
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: finmanager
spec:
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull # facoltativo: serve solo se i pacchetti GHCR sono privati
      containers:
        - name: app
          image: ghcr.io/giallo1o/finmanager-transaction:latest
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pg-trans:5432/db_transactions
            - name: USER_SERVICE_URL
              value: http://user-service:8082
            # Lettura scontrini con Claude; il Secret si crea con deploy.sh (ANTHROPIC_API_KEY=...). Senza, l'app parte ma la lettura scontrini e' disattivata.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finmanager-anthropic
                  key: api-key
                  optional: true
            # Lista della spesa di Home Assistant (facoltativa): Secret finmanager-ha con url e token. Senza, la lista non compare.
            - name: HA_URL
              valueFrom:
                secretKeyRef:
                  name: finmanager-ha
                  key: url
                  optional: true
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finmanager-ha
                  key: token
                  optional: true
            - name: HA_SHOPPING_ENTITY
              value: todo.lista_della_spesa
            - name: SPRING_DATASOURCE_USERNAME
              value: user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finmanager-db
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: finmanager
spec:
  ports:
    - port: 8080
  selector:
    app: transaction-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: finmanager
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull # facoltativo: serve solo se i pacchetti GHCR sono privati
      containers:
        - name: app
          image: ghcr.io/giallo1o/finmanager-user:latest
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pg-users:5432/db_users
            - name: SPRING_DATASOURCE_USERNAME
              value: user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finmanager-db
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: finmanager
spec:
  ports:
    - port: 8082
  selector:
    app: user-service
---
# ==========================================
# FRONTEND (EXPOSED VIA NODEPORT)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: finmanager
spec:
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull # facoltativo: serve solo se i pacchetti GHCR sono privati
      containers:
        - name: frontend
          image: ghcr.io/giallo1o/finmanager-frontend:latest
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: finmanager
spec:
  type: NodePort
  ports:
    - port: 80
      nodePort: 30000
  selector:
    app: frontend-service
---
# ==========================================
# BACKUP GIORNALIERO DEI DATABASE (ultimi 14 giorni)
# I file stanno nel volume backups-pvc, sullo stesso server: copiali ogni tanto su un altro supporto.
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups-pvc
  namespace: finmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: finmanager
spec:
  # Prima del backup notturno di Proxmox (02:00 su nas-pbs), cosi' il backup contiene i dump della notte
  schedule: "30 1 * * *"
  timeZone: "Europe/Rome"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: finmanager-db
                      key: password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  d=$(date +%Y%m%d-%H%M%S)
                  pg_dump -h pg-trans -U user db_transactions | gzip > /backups/transactions-$d.sql.gz
                  pg_dump -h pg-users -U user db_users | gzip > /backups/users-$d.sql.gz
                  find /backups -name '*.sql.gz' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups-pvc
