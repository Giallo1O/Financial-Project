spring.application.name=financial-manager

# Mostra il motivo degli errori (es. 'scontrino gia' salvato') al frontend
spring.web.error.include-message=always

spring.threads.virtual.enabled=true

# Servizio che valida i token (Authorization: Bearer ...)
user-service.url=${USER_SERVICE_URL:http://localhost:8082}

# Origini ammesse dal browser (separate da virgola)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Foto/PDF degli scontrini
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=40MB

# Modello Claude per leggere gli scontrini; la chiave e' ANTHROPIC_API_KEY (variabile d'ambiente)
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Mostra l'SQL in console per vedere cosa succede (molto utile per il debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Lista della spesa di Home Assistant (facoltativa): URL interno di HA, token a lunga durata ed entita' todo.
# Senza URL o token la lista "Casa (Home Assistant)" non compare.
home-assistant.url=${HA_URL:}
home-assistant.token=${HA_TOKEN:}
home-assistant.shopping-entity=${HA_SHOPPING_ENTITY:todo.lista_della_spesa}
