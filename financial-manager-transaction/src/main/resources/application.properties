spring.application.name=financial-manager

spring.threads.virtual.enabled=true

# Servizio che valida i token (Authorization: Bearer ...)
user-service.url=${USER_SERVICE_URL:http://localhost:8082}

# Origini ammesse dal browser (separate da virgola)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Indirizzo del server Kafka (nel tuo caso sara l'IP del servizio su K8s)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Serializzazione: Kafka capisce solo byte. 
# Dobbiamo dirgli come trasformare la Chiave e il Valore del messaggio.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Opzionale: aggiunge informazioni sul tipo di oggetto nel messaggio JSON
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.jpa.hibernate.ddl-auto=update
# Mostra l'SQL in console per vedere cosa succede (molto utile per il debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true