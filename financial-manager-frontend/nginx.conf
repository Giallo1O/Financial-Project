server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Foto e PDF degli scontrini (fino a 4 file): il limite predefinito di nginx e' 1 MB. Allineato a spring.servlet.multipart.max-request-size.
    client_max_body_size 40m;

    # Gzip settings for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # React Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxies (Kubernetes e docker compose): il browser chiama sempre lo stesso indirizzo da cui ha aperto l'app, da qualunque dispositivo
    location /api/transaction/ {
        proxy_pass http://transaction-service:8080/;
        proxy_read_timeout 120s; # la lettura di uno scontrino con l'AI puo' richiedere piu' dei 60 s predefiniti
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/user/ {
        proxy_pass http://user-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Il service worker e il manifest non devono restare in cache: altrimenti gli aggiornamenti non arrivano ai telefoni
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
