<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa tutto lo schermo (notch); le zone sicure si gestiscono nel CSS con env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FinManager</title>

    <!-- App installabile (Android: "Installa app"; iPhone: Condividi > "Aggiungi alla schermata Home") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12100e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinManager" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!-- Nome e icona che Home Assistant mostra nella pagina di login quando colleghi l'account (IndieAuth h-app) -->
    <div class="h-app" hidden><img src="/icon-192.png" class="u-logo" alt="" /><a href="/" class="u-url p-name">FinManager</a></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
