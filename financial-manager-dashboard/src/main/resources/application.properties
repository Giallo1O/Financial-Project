spring.application.name=financial-manager-dashboard

# Cambiamo porta per evitare conflitti
server.port=8081

# Fondamentale per creare la tabella al primo avvio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurazione Database (usa un DB diverso, es. postgres_dashboard)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Abilitiamo Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Servizio che valida i token (Authorization: Bearer ...)
user-service.url=${USER_SERVICE_URL:http://localhost:8082}

# Origini ammesse dal browser (separate da virgola)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- KAFKA CONSUMER CONFIG ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Identificativo univoco di questo servizio
spring.kafka.consumer.group-id=dashboard-group-v2
# Da dove iniziare a leggere se e un nuovo consumer (earliest = dall'inizio del log)
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializzazione - il value è JSON da mappare su TransactionEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Non usare header dei tipi - mappa sempre su TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=it.glknet.financial_manager.dto.TransactionEvent

